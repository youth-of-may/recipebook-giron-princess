{% extends "base.html" %}

{% block title %}
    Recipe
{% endblock %}

{% block subheading %}
    Recipe Image Adder Page
{% endblock %}

{% block content %}
    <h2>Upload Image for {{ recipe.name }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>

    <a href="{% url 'recipe-detail' recipe.pk %}">Back to Recipe</a>
{% endblock %}
