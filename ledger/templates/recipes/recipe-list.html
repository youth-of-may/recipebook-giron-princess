{% extends "base.html" %}

{% block title %}
    Recipes
{% endblock %}

{% block subheading %}
    Recipe List Page
{% endblock %}

{% block content %}
    <div>
        <ol>
            {% for recipe in recipes %}
                <li>
                    <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
                </li>
            {% endfor %}
        </ol>
    </div>
{% endblock %}
